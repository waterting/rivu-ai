# Render deployment for Rivu.
#
# Two services are required. The web service serves the API but does NOT process
# datasets: with APP_ENV=production, INLINE_PROCESSING defaults to false and the
# API only inserts a queued job row. A separate worker service
# (`rivu-worker`, start command `python -m app.workers.runner`) is what claims
# those jobs, parses and profiles the file, and writes the quality report.
#
# Deploying only the web service leaves every upload on "processing" forever.
# Confirm the worker is running with:
#   curl https://<api-host>/health     # -> "worker": {"online": true, ...}
#   curl https://<api-host>/metrics    # -> rivu_worker_last_seen_timestamp_seconds
# A missing worker shows "worker": {"online": false} and no heartbeat metric.
services:
  - type: web
    name: rivu-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Must be "production": it is what disables in-process processing and turns
      # on the production security checks. A web service reporting
      # "environment":"development" on /health is misconfigured.
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_SYNC
        sync: false
      - key: CATALOGUE_DATABASE_URL
        sync: false
      - key: CATALOGUE_JWT_SECRET
        sync: false
      - key: CATALOGUE_AUTO_CREATE_SCHEMA
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: REQUIRE_EMAIL_VERIFICATION
        value: "false"
      - key: FRONTEND_URL
        value: https://rivu-ai-woad.vercel.app
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOWED_ORIGINS
        value: https://rivu-ai-woad.vercel.app,https://rivu-ai-murex.vercel.app,https://rivu.ai
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: rivu-datasets
      - key: S3_REGION
        value: us-east-1
      - key: S3_USE_SSL
        value: "true"
      # Optional: set to "true" only for local development or a single-instance
      # deployment with no worker. Never enable it alongside the worker service.
      - key: INLINE_PROCESSING
        value: "false"

  # The durable queue consumer. Without this service no dataset is ever
  # profiled, no matter how healthy the web service looks.
  - type: worker
    name: rivu-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    # Overrides the image CMD (which runs migrations + uvicorn) with the queue loop.
    dockerCommand: python -m app.workers.runner
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      # The worker downloads the original file from object storage to parse it.
      # These must be set on the worker too, not only on the web service.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_ACCESS_KEY
        sync: false
      - key: S3_SECRET_KEY
        sync: false
      - key: S3_BUCKET
        value: rivu-datasets
      - key: S3_REGION
        value: us-east-1
      - key: S3_USE_SSL
        value: "true"
      # AI analysis jobs call Groq; profiling does not, but keeping the key here
      # lets the worker serve every job type.
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: INLINE_PROCESSING
        value: "false"